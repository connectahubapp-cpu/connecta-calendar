# Fly.io の設定。初回は README の手順で `fly launch --no-deploy` → `fly volumes create data` → `fly secrets set ...`
app = "connecta-calendar"
primary_region = "nrt"   # 東京

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DB_PATH = "/data/calendar.db"
  ALLOWED_ORIGIN = "https://connectahubapp-cpu.github.io"
  MIN_RANK = "3"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
