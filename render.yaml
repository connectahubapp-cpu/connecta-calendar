# Render (無料プラン) の設定。Dashboard → New → Blueprint でこのリポジトリを選ぶと、この通りに作られる。
# GAS_URL と SYNC_SECRET は画面で入れる (sync: false = ここには書かない)。
services:
  - type: web
    name: connectacalendar
    runtime: docker
    plan: free
    region: singapore
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ALLOWED_ORIGIN
        value: https://connectahubapp-cpu.github.io
      - key: MIN_RANK
        value: "3"
      - key: DB_PATH
        value: /data/calendar.db
      - key: GAS_URL
        sync: false
      - key: SYNC_SECRET
        sync: false
